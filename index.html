<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var isVite = function (m) {
          if (!m) return false;
          var s = typeof m === 'string' ? m : (m.message || m.reason || String(m));
          return typeof s === 'string' && s.indexOf('[vite]') !== -1;
        };
        ['error', 'warn', 'info', 'log'].forEach(function (method) {
          var orig = console[method];
          if (orig) {
            console[method] = function () {
              if (arguments && isVite(arguments[0])) return;
              orig.apply(console, arguments);
            };
          }
        });
        window.addEventListener('error', function (e) {
          if (isVite(e.message || e.error)) {
            e.preventDefault && e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          if (isVite(e.reason)) {
            e.preventDefault && e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
